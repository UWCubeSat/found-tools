[project]
name = "found-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.0",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.1",
    "scipy>=1.16.3",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
]

[project.scripts]
found_tools_attitude = "found_tools.calibrate.main:main"
found_tools_render = "found_tools.render.main:main"

[dependency-groups]
dev = ["pytest", "coverage"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    # bpy is Blender's bundled Python module, not installable for this
    # project's Python version; this file runs inside Blender's own
    # interpreter and cannot be exercised by the test suite.
    "*/found_tools/render/blender_scene.py",
]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

